<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spara Energia – Suppilo</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1B2A4A}
    #suppilo-frame{border:0;width:100%;height:100%;display:block;background:#1B2A4A}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1B2A4A;color:#E8EDF5;font-family:system-ui,sans-serif;font-size:14px;z-index:5}
  </style>
</head>
<body>
  <div id="loader">Ladataan Suppiloa…</div>
  <iframe id="suppilo-frame" src="crm.html" title="Suppilo CRM"></iframe>
  <script>
    (function(){
      const frame=document.getElementById('suppilo-frame');
      const loader=document.getElementById('loader');
      frame.addEventListener('load',()=>{
        try{
          const doc=frame.contentDocument;
          if(!doc) throw new Error('CRM-dokumenttia ei saatu auki');
          if(!doc.getElementById('media-seuranta-loader')){
            const s=doc.createElement('script');
            s.id='media-seuranta-loader';
            s.src='media-seuranta.js?v=2026-09-17.2';
            s.defer=true;
            doc.body.appendChild(s);
          }
          loader.style.display='none';
        }catch(e){
          console.error('Mediaseurannan lataus epäonnistui',e);
          loader.textContent='Suppilo avautui, mutta Seuranta-moduulia ei saatu ladattua.';
          setTimeout(()=>loader.style.display='none',2200);
        }
      });
    })();
  </script>
</body>
</html>
