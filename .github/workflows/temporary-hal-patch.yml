name: Temporary HAL patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hal-light-header
          fetch-depth: 0
      - name: Patch CRM header
        shell: python
        run: |
          from pathlib import Path
          path = Path('crm.html')
          text = path.read_text(encoding='utf-8')
          css_anchor = "    .header-logo { max-height:36px;width:auto;display:block; }"
          css = r'''
    .hal-light-wrap { position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;pointer-events:none; }
    .hal-light { position:relative;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 34%,#fff 0 3%,#ff9b9b 5%,#ff3535 14%,#c40000 37%,#510000 65%,#160000 100%);border:2px solid #10131b;box-shadow:0 0 0 2px rgba(255,255,255,.06),inset 0 -6px 10px rgba(0,0,0,.75),inset 0 5px 8px rgba(255,255,255,.18),0 0 10px rgba(255,30,30,.7),0 0 24px rgba(255,0,0,.28);animation:hal-breathe 3.2s ease-in-out infinite; }
    .hal-light::before { content:'';position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.92) 0 4%,rgba(255,255,255,.24) 7%,transparent 27%); }
    .hal-light::after { content:'';position:absolute;left:50%;bottom:4px;width:45%;height:10%;transform:translateX(-50%);border-radius:50%;background:rgba(255,80,80,.25);filter:blur(2px); }
    @keyframes hal-breathe { 0%,100%{filter:brightness(.82);box-shadow:0 0 0 2px rgba(255,255,255,.05),inset 0 -6px 10px rgba(0,0,0,.75),inset 0 5px 8px rgba(255,255,255,.16),0 0 8px rgba(255,30,30,.55),0 0 18px rgba(255,0,0,.18)} 50%{filter:brightness(1.18);box-shadow:0 0 0 2px rgba(255,255,255,.08),inset 0 -6px 10px rgba(0,0,0,.65),inset 0 5px 8px rgba(255,255,255,.24),0 0 14px rgba(255,40,40,.9),0 0 34px rgba(255,0,0,.38)} }
    @media (prefers-reduced-motion:reduce) { .hal-light { animation:none; } }
'''
          if '.hal-light-wrap {' not in text:
              if css_anchor not in text: raise SystemExit('CSS anchor not found')
              text = text.replace(css_anchor, css_anchor + css, 1)
          mobile_anchor = "      .header-logo { max-height:24px; }"
          mobile_css = "\n      .hal-light { width:28px;height:28px; }"
          if mobile_css.strip() not in text:
              if mobile_anchor not in text: raise SystemExit('Mobile anchor not found')
              text = text.replace(mobile_anchor, mobile_anchor + mobile_css, 1)
          html_anchor = '  <div class="hdr-right">'
          hal_html = '  <div class="hal-light-wrap" aria-hidden="true"><div class="hal-light"></div></div>\n'
          if 'class="hal-light-wrap"' not in text:
              if html_anchor not in text: raise SystemExit('HTML anchor not found')
              text = text.replace(html_anchor, hal_html + html_anchor, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm.html
          git diff --cached --quiet && exit 0
          git commit -m "Add visual HAL light to CRM header"
          git push origin HEAD:feature/hal-light-header
